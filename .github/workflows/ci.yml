name: Web checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DSU_ERP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DSU_ERP/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
